<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test login</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="accueil">
        <h1>Portail <span>Gestion des Stages/Alternance</span></h1>
      </div>
    </header>
    <main>
      <form action="action_page.php" method="post">
        <div class="imgcontainer">
          <!--<img src="img_avatar2.png" alt="Avatar" class="avatar">-->
        </div>

        <div class="container">
          <label for="uname"><b>Username</b></label>
          <input
            type="text"
            placeholder="Enter Username"
            name="uname"
            required
            pattern="([pP][0-9]{7})"
            title="'p' suivi de sept chiffres"
          />

          <label for="psw"><b>Password</b></label>
          <input
            type="password"
            placeholder="Enter Password"
            name="psw"
            id="psw"
            required
            pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$"
            title="Le mot de passe doit contenir :
- au moins une majuscule
- au moins une minuscule
- au moins un chiffre
- au moins un caractère spécial (@$!%*?&)
- minimum 8 caractères"
          />

          <span
          id="toggleIcon"
          onclick="togglePassword()"
          style="cursor: pointer; display: inline-block; width: 24px; height: 24px; vertical-align: middle;"
        >
          <!-- Icône initiale : œil barré -->
          <svg width="24" height="24" viewBox="0 0 64 64">
            <path d="M2,32 C12,12 52,12 62,32 C52,52 12,52 2,32 Z" stroke="black" stroke-width="2" fill="none"/>
            <circle cx="32" cy="32" r="6" fill="black"/>
            <line x1="8" y1="8" x2="56" y2="56" stroke="red" stroke-width="3"/>
          </svg>
        </span>

          <button type="submit">Login</button>
        </div>

      </form>
    </main>
  </body>
</html>
<script src="script.js"></script>
