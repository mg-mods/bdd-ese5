<body>
    <!--Contents-->
    <main>

        <div class="login-box">
            <form id="loginForm" method="POST">

                <label for="loginInput">Identifiant :</label>
                <input placeholder="Identifiant" type="text" id="loginInput" name="loginInput" required
                    pattern="[A-Za-z]{1}[0-9]{7}">

                <label for="passwordInput">Mot de passe :</label>
                <input placeholder="Mot de passe" type="password" id="passwordInput" name="passwordInput" required>

                <button type="button" class="reveal-btn" id="revealBtn">
                    <svg width="20px" height="20px" viewBox="0 0 24 24" fill="none"
                        xmlns="http://www.w3.org/2000/svg">
                        <g>
                            <circle cx="12" cy="13" r="2" stroke="#000000" stroke-linejoin="round" />
                            <path
                                d="M12 7.5C7.69517 7.5 4.47617 11.0833 3.39473 12.4653C3.14595 12.7832 3.14595 13.2168 3.39473 13.5347C4.47617 14.9167 7.69517 18.5 12 18.5C16.3048 18.5 19.5238 14.9167 20.6053 13.5347C20.8541 13.2168 20.8541 12.7832 20.6053 12.4653C19.5238 11.0833 16.3048 7.5 12 7.5Z"
                                stroke="#000000" stroke-linecap="round" stroke-linejoin="round" />
                        </g>
                    </svg>
                </button>

                <button type="submit" class="login-btn">Connexion</button>

            </form>

            <div id="errorMsg" class="error"></div>
        </div>


    </main>

</body>

</html>
