
<!DOCTYPE html>
<html lang="fr">

<head>
    <!--General Properties-->
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=0">
    <title>Bowl</title>
    <link rel='icon' type='icon' href='/favicon.ico' />
    <meta property="Website Name" content="Bowl">
    <meta property="Website Owners" content="IUT Lyon 1, Dept GEII">
    <meta property="Website Administrator" content="IUT Lyon 1, Gr531 2025-26">
    <meta property="Website Certificate" content="Self-signed">
    <meta property="Website Version" content="v1.0">

    <!--Embed Properties-->
    <meta property="og:title" content="Bowl"> <!--Embeded Title-->
    <meta property="og:site_name" content="Bowl"> <!--Embeded Source-->
    <meta property="og:description" content="A bowl of moddles"> <!--Embeded Description-->
    <meta property="og:image" content="/webhook.png"> <!--Embeded Image-->
    <meta content="#00abb8" data-react-helmet="true" name="theme-color" /> <!--Embeded Color-->
    <meta property="og:image:width" content="599">
    <meta property="og:image:height" content="337">
    <meta name="twitter:card" content="summary_large_image"> <!--Show large embed image-->
    <meta property="og:url" content="/">
    <meta property="og:type" content="website">
    <meta name="keywords" content="Bowl, Bol, IUT, Lyon 1, Mire, GEII">

    <!--Global Links-->
    <link href="../localcommon/globalStyles.css" rel="stylesheet">  <!--rajouter les ./--> 
    <link href="../localcommon/globalFonts.css" rel="stylesheet"> <!--rajouter les ./--> 
    <script src="../localcommon/globalScripts.js"></script>       <!--rajouter les ./--> 

    <!--Local Links-->
    <link href="styles.css" rel="stylesheet">
    <script src="scripts.js" defer></script>

</head>

<body>

    <header>
        <div class="header-container">
            <div class="header-left">
                <div class="header-logo">Bowl</div>
                <nav>
                    <a href="#">Accueil</a>
                    <a href="#">Espace personnel</a>
                    <a href="https://support.univ-lyon1.fr/" target="_blank">Support</a>
                </nav>
            </div>
            <button id="logoff" class="header-user">Déconnecter</button>
        </div>
    </header>
<main>
        <section class="filtres">
            <input type="text" id="searchInput" placeholder="Rechercher une entreprise...">

            <select id="filtreStatut">
                <option value="tous">Tous les statuts</option>
                <option value="envoyée">Envoyée</option>
                <option value="vue">Vue</option>
                <option value="en cours">En cours</option>
                <option value="acceptée">Acceptée</option>
                <option value="refusée">Refusée</option>
            </select>
            
            <button id="btnRetour" class="btn-retour">← Retour</button>
        </section>

        <section class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Entreprise</th>
                        <th>Offre</th>
                        <th>Date</th>
                        <th>Statut</th>
                        <th>Dossiers</th>
                        <th>Tuteur</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="tableCandidatures">
                    <!-- Généré par JS -->
                </tbody>
            </table>
        </section>
    </main>

    


    <!-- ✅ FOOTER -->
    <footer>
        <div class="footer-container">
            <div class="footer-logo">Bowl</div>
            <nav>
                <a href="https://wwwgeii.univ-lyon1.fr/">Mire GEII</a>
                <a href="https://iut.univ-lyon1.fr/">IUT Lyon 1</a>
            </nav>
        </div>
    </footer>

    <!-- ✅ POPUP (CONSERVÉ POUR PLUS TARD) -->
    <div class="modal" id="courseModal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <p class="modal-title" id="modal-title">Title</p>
            <p class="modal-subtitle" id="modal-subtitle">Subtitle</p>
            <p class="modal-desc" id="modal-description">This is a description.</p>
            <button class="modal-button" id="modal-button">Button</button>
        </div>
    </div>

</body>
</html>
